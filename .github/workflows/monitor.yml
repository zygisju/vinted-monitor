name: Vinted Book Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    concurrency:
      group: monitor
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Pull latest changes
        run: |
          git pull --rebase origin main || true

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # <--- Pridėta Discord nuorodos integracija
        run: |
          python vinted_monitor.py

      - name: Commit and push changes
        run: |
          git add seen_items.json
          if git diff --staged --quiet; then
            echo "Nėra naujų pakeitimų."
            exit 0
          fi
          git commit -m "Update seen items cache"
          git push origin HEAD:main
