name: Vinted Book Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    concurrency:
      group: monitor
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python vinted_monitor.py

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        run: |
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add seen_items.json
          git commit -m "Update seen items cache"
          
          # Fetch latest changes from remote
          git fetch origin main
          
          # Try to rebase, if it fails, abort and use manual merge
          if ! git rebase origin/main; then
            echo "Rebase failed, aborting..."
            git rebase --abort
            git merge origin/main -m "Merge remote changes"
          fi
          
          # Push changes
          git push origin main
