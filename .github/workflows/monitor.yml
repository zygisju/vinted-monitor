name: Vinted Book Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    concurrency:
      group: monitor
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python vinted_monitor.py

      - name: Pull latest changes
        run: |
          git pull --rebase origin main

      - name: Commit and push seen items
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update seen items cache'
          file_pattern: 'seen_items.json'
